<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="48" fill="#FAF6F0" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Forma de cuero/cartera -->
  <g transform="translate(15, 15)">
    <path d="M15,60 C5,60 2,45 2,30 C2,18 10,8 30,8 L40,8 C60,8 68,18 68,30 C68,45 65,60 55,60 Z" 
          fill="url(#leatherGrad)" stroke="#6B3410" stroke-width="1.5"/>
    
    <path d="M8,28 L62,28" stroke="#F4A460" stroke-width="1.2" stroke-dasharray="3,2"/>
    <path d="M8,38 L62,38" stroke="#F4A460" stroke-width="1.2" stroke-dasharray="3,2"/>
    
    <!-- Hebilla -->
    <rect x="28" y="10" width="14" height="12" rx="2" fill="#D4A574" stroke="#8B4513" stroke-width="1.2"/>
    <rect x="32" y="14" width="6" height="4" rx="1" fill="#8B4513"/>
    
    <!-- Inicial R -->
    <circle cx="35" cy="38" r="6" fill="none" stroke="#F4A460" stroke-width="1.2"/>
    <text x="35" y="41" font-family="Georgia, serif" font-size="8" fill="#F4A460" text-anchor="middle" font-weight="bold">R</text>
  </g>
</svg>